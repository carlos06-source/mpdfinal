<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>MPD · Pizzería: Elasticidad + Demanda + Inventario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.5.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.5.0/build/stlite.js";
      mount(
        {
          requirements: ["pandas", "numpy", "matplotlib", "scikit-learn", "scipy"],
          entrypoint: "app.py",
          files: {
            "app.py": { url: "./app.py" },
            "pizza_sales_ordenado.csv": { url: "./pizza_sales_ordenado.csv" },
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
